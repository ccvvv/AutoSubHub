name: Build candidate subscription

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: build-candidates-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax for phone probe and receipt validator
        run: python -m py_compile termux_probe.py download_candidates.py upload_receipt.py scripts/candidate_queue.py scripts/finalize_phone_receipt.py tools/v2raytun_bridge.py tools/build_v2raytun_candidate.py tools/collect_v2raytun_survivors.py upload_v2raytun_receipt.py

      - name: Install Mihomo core
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz | gunzip -c > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Test phone receipt finalization and Mihomo config
        env:
          MIHOMO_BIN: ${{ github.workspace }}/mihomo
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate candidate files
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
          SOURCE_WORKERS: "10"
        run: |
          python build.py
          python tools/build_v2raytun_candidate.py

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'autohub-candidates-latest' || format('autohub-candidates-pr-{0}', github.event.pull_request.number || github.run_id) }}
          path: candidates/
          if-no-files-found: error
          retention-days: 90
      
      # Upload first; only after it succeeds remove older main artifacts.
      - name: Keep only newest main candidate artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const candidates = artifacts
              .filter(a => a.name === "autohub-candidates-latest" && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of candidates.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

      # Public subscription URLs are stored on a dedicated data branch.
      # PR validation never publishes credentials; main pushes and manual runs do.
      - name: Publish public candidate subscription
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/published
          if git ls-remote --exit-code --heads origin published-subscriptions >/dev/null 2>&1; then
            git clone --depth 1 --branch published-subscriptions "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/published
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/published
            cd /tmp/published
            git checkout --orphan published-subscriptions
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          mkdir -p /tmp/published/candidate
          cp candidates/candidates.yaml /tmp/published/candidate/subscription.yaml
          cp candidates/manifest.json /tmp/published/candidate/manifest.json
          cp candidates/v2raytun-sub.txt /tmp/published/candidate/v2raytun-sub.txt
          cp candidates/v2raytun-links.txt /tmp/published/candidate/v2raytun-links.txt
          cp candidates/v2raytun-map.json /tmp/published/candidate/v2raytun-map.json
          cd /tmp/published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate/subscription.yaml candidate/manifest.json candidate/v2raytun-sub.txt candidate/v2raytun-links.txt candidate/v2raytun-map.json
          if git diff --cached --quiet; then
            echo "Candidate unchanged; public URL already serves this version."
          else
            git commit -m "Publish latest public candidate subscription"
            git push origin HEAD:published-subscriptions
          fi
