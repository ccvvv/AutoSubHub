name: Ingest domestic probe results

on:
  repository_dispatch:
    types: [domestic-probe-results]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: domestic-probe-state
  cancel-in-progress: false

jobs:
  validate-and-store:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: pip install "PyYAML>=6,<7"

      - name: Validate report and build final domestic subscription
        id: report
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import yaml
          from datetime import datetime, timezone
          from pathlib import Path

          raw = os.environ.get("PAYLOAD", "")
          if not raw or len(raw.encode("utf-8")) > 60000:
              raise SystemExit("Missing or oversized report payload")
          data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit("Payload must be an object")

          task_id = data.get("task_id")
          if task_id is not None and (
              not isinstance(task_id, str)
              or not re.fullmatch(r"mi6-[0-9]{5,}-[0-9]+", task_id)
          ):
              raise SystemExit("Invalid task_id")

          device_id = data.get("device_id")
          network = data.get("network")
          tested_at = data.get("tested_at")
          results = data.get("results")
          if not isinstance(device_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,40}", device_id):
              raise SystemExit("Invalid device_id")
          if network not in {"mainland-wifi", "mainland-mobile", "other"}:
              raise SystemExit("Invalid network")
          if not isinstance(tested_at, str) or len(tested_at) > 40:
              raise SystemExit("Invalid tested_at")
          datetime.fromisoformat(tested_at.replace("Z", "+00:00"))
          if not isinstance(results, list) or not 1 <= len(results) <= 50:
              raise SystemExit("results must contain 1..50 entries")

          clean = []
          seen_node_ids = set()
          for item in results:
              if not isinstance(item, dict):
                  raise SystemExit("Each result must be an object")
              node_id = item.get("node_id")
              protocol = item.get("protocol")
              status = item.get("status")
              gpt_ok = item.get("gpt_ok")
              latency = item.get("latency_ms")
              if gpt_ok is not None and not isinstance(gpt_ok, bool):
                  raise SystemExit("gpt_ok must be boolean or null")
              speed = item.get("download_kbps")
              if not isinstance(node_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{8,80}", node_id):
                  raise SystemExit("Invalid opaque node_id")
              if node_id in seen_node_ids:
                  raise SystemExit("Duplicate node_id in report")
              seen_node_ids.add(node_id)
              if protocol not in {"shadowsocks", "vmess", "vless", "trojan", "hysteria2", "tuic", "other"}:
                  raise SystemExit("Invalid protocol")
              if status not in {"passed", "failed", "inconclusive"}:
                  raise SystemExit("Invalid status")
              if latency is not None and (not isinstance(latency, (int, float)) or not 0 <= latency <= 600000):
                  raise SystemExit("Invalid latency_ms")
              if speed is not None and (not isinstance(speed, (int, float)) or not 0 <= speed <= 1000000):
                  raise SystemExit("Invalid download_kbps")
              clean.append({
                  "node_id": node_id,
                  "protocol": protocol,
                  "status": status,
                  "gpt_ok": gpt_ok,
                  "latency_ms": latency,
                  "download_kbps": speed,
              })

          # Match every returned ID against the exact GitHub candidate batch.
          manifest_path = Path("data/domestic-probe/candidate-manifest.json")
          candidate_path = Path("data/domestic-probe/candidates.yaml")
          if not manifest_path.exists() or not candidate_path.exists():
              raise SystemExit("No GitHub candidate batch exists; refusing to publish")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_ids = {
              item.get("node_id") for item in manifest.get("nodes", [])
              if isinstance(item, dict) and isinstance(item.get("node_id"), str)
          }
          returned_ids = {item["node_id"] for item in clean}
          if not returned_ids or not returned_ids.issubset(manifest_ids):
              raise SystemExit("Receipt contains node IDs outside the current candidate batch")

          report = {
              "schema_version": 1,
              "task_id": task_id,
              "device_id": device_id,
              "network": network,
              "tested_at": tested_at,
              "received_at": datetime.now(timezone.utc).isoformat(),
              "results": clean,
          }
          out = Path("data/domestic-probe/latest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")

          if task_id is not None:
              task_path = Path("data/domestic-probe/task.json")
              if not task_path.exists():
                  raise SystemExit("No active task manifest")
              task = json.loads(task_path.read_text(encoding="utf-8"))
              if task.get("task_id") != task_id or task.get("status") != "pending":
                  raise SystemExit("Task is stale, already completed, or not pending")
              if device_id != task.get("target_device_id"):
                  raise SystemExit("Report device does not match task target")
              max_nodes = task.get("max_nodes")
              if not isinstance(max_nodes, int) or not 1 <= max_nodes <= 50:
                  raise SystemExit("Task has an invalid max_nodes value")
              if len(clean) > max_nodes:
                  raise SystemExit("Report contains more nodes than the task allows")
              expires = datetime.fromisoformat(task["expires_at"].replace("Z", "+00:00"))
              if expires <= datetime.now(timezone.utc):
                  raise SystemExit("Task has expired")
              task["status"] = "completed"
              task["completed_at"] = datetime.now(timezone.utc).isoformat()
              task_path.write_text(json.dumps(task, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")

          # Only passed domestic tests enter the final published subscription.
          passed_ids = {
              item["node_id"] for item in clean if item["status"] == "passed"
          }
          if passed_ids:
              candidate_config = yaml.safe_load(candidate_path.read_text(encoding="utf-8"))
              candidate_proxies = candidate_config.get("proxies", [])
              selected = []
              rename = {}
              for proxy in candidate_proxies:
                  old_name = str(proxy.get("name", ""))
                  match = re.match(r"^probe_([a-f0-9]{24})__(.+)$", old_name)
                  if match and f"probe_{match.group(1)}" in passed_ids:
                      clean_proxy = dict(proxy)
                      clean_proxy["name"] = match.group(2)
                      selected.append(clean_proxy)
                      rename[old_name] = match.group(2)
              if not selected:
                  raise SystemExit("No passed receipt IDs matched candidate proxy entries")

              selected_names = {proxy["name"] for proxy in selected}
              groups = candidate_config.get("proxy-groups", [])
              group_names = {group.get("name") for group in groups}
              for group in groups:
                  group["proxies"] = [
                      rename.get(name, name) for name in group.get("proxies", [])
                      if name in rename or name in group_names
                  ]
              final_config = dict(candidate_config)
              final_config["proxies"] = selected
              final_config["proxy-groups"] = groups
              site = Path("site")
              site.mkdir(parents=True, exist_ok=True)
              final_path = site / "subscription.yaml"
              final_path.write_text(
                  yaml.safe_dump(final_config, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              # Validate that all final group references resolve.
              available = selected_names | group_names | {"DIRECT", "REJECT"}
              for group in groups:
                  missing = set(group.get("proxies", [])) - available
                  if missing:
                      raise SystemExit(f"Final group {group.get('name')} has missing refs: {sorted(missing)}")
              html = (
                  "<!doctype html><html lang='zh-CN'><meta charset='utf-8'>"
                  "<meta name='viewport' content='width=device-width'>"
                  "<title>AutoSubHub 国内实测最终订阅</title>"
                  "<body style='font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px'>"
                  "<h1>AutoSubHub 国内实测最终订阅</h1>"
                  f"<p>国内实测通过节点：{len(selected)}</p>"
                  f"<p>回执时间：{tested_at}</p>"
                  "<p><a href='subscription.yaml'>下载最终 Clash / Mihomo 订阅</a></p>"
                  "</body></html>"
              )
              (site / "index.html").write_text(html, encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  output_file.write("publish_final=true\n")
          else:
              print("No node passed the domestic test; keeping the previous published subscription.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  output_file.write("publish_final=false\n")

          print(f"Validated {len(clean)} domestic probe results")
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/domestic-probe
          git diff --cached --quiet || {
            git commit -m "chore: ingest domestic probe results"
            git push
          }

      - name: Configure Pages
        if: steps.report.outputs.publish_final == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload final subscription artifact
        if: steps.report.outputs.publish_final == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy final subscription
        if: steps.report.outputs.publish_final == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
