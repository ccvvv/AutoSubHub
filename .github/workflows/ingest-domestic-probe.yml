name: Ingest domestic probe receipt

on:
  repository_dispatch:
    types: [domestic-probe-results]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: domestic-probe-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download current candidate batch
        run: |
          mkdir -p site
          curl -fsSL --retry 3 --retry-all-errors --max-time 30 \
            "https://ccvvv.github.io/AutoSubHub/candidates.yaml" -o site/candidates.yaml
          curl -fsSL --retry 3 --retry-all-errors --max-time 30 \
            "https://ccvvv.github.io/AutoSubHub/candidate-manifest.json" -o site/candidate-manifest.json
          curl -fsSL --retry 3 --retry-all-errors --max-time 30 \
            "https://ccvvv.github.io/AutoSubHub/index.html" -o site/index.html
          status=$(curl -sSL --retry 3 --retry-all-errors --max-time 30 \
            -o site/subscription.yaml -w "%{http_code}" \
            "https://ccvvv.github.io/AutoSubHub/subscription.yaml")
          if [ "$status" = "404" ]; then
            rm -f site/subscription.yaml
          elif [ "$status" != "200" ]; then
            echo "Could not safely retrieve previous final subscription (HTTP $status)." >&2
            exit 1
          fi

      - name: Validate receipt and build final subscription
        id: receipt
        run: |
          python ingest_domestic_probe.py | tee "$RUNNER_TEMP/ingest-result.txt"
          grep '^publish_final=' "$RUNNER_TEMP/ingest-result.txt" >> "$GITHUB_OUTPUT"

      - name: Save sanitized receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/domestic-probe/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record domestic probe receipt [skip ci]"
            git push
          fi

      - name: Prepare Pages report
        run: |
          mkdir -p site/domestic-probe
          cp data/domestic-probe/latest.json site/domestic-probe/latest.json

      - name: Configure Pages
        if: steps.receipt.outputs.publish_final == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.receipt.outputs.publish_final == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy final subscription
        if: steps.receipt.outputs.publish_final == 'true'
        uses: actions/deploy-pages@v4
