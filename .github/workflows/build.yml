name: Build candidate subscription

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: build-candidates
  cancel-in-progress: true

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate candidate files (no strict proxy/speed rejection)
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
          SOURCE_WORKERS: "10"
        run: python build.py

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: autohub-candidates
          path: candidates/
          if-no-files-found: error
          retention-days: 3
