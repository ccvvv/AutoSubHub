name: Auto build subscription

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/domestic-probe/**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile build.py prepare_candidates.py

      - name: Install Mihomo core
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz | gunzip -c > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Preserve last published final subscription
        id: preserve-final
        run: |
          mkdir -p "$RUNNER_TEMP"
          status=$(curl -sSL --retry 3 --retry-all-errors --max-time 30 \
            -o "$RUNNER_TEMP/previous-subscription.yaml" -w "%{http_code}" \
            "https://ccvvv.github.io/AutoSubHub/subscription.yaml")
          if [ "$status" = "200" ]; then
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            rm -f "$RUNNER_TEMP/previous-subscription.yaml"
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not safely read the previous final subscription (HTTP $status)." >&2
            exit 1
          fi

      - name: Build, proxy-test and validate subscription
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
          CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT }}
          HANDSHAKE_WORKERS: ${{ vars.HANDSHAKE_WORKERS }}
          HTTP_WORKERS: ${{ vars.HTTP_WORKERS }}
          HTTP_TEST_TIMEOUT: ${{ vars.HTTP_TEST_TIMEOUT }}
          DOWNLOAD_BYTES: ${{ vars.DOWNLOAD_BYTES }}
          DOWNLOAD_MIN_KBPS: 500
          SPEED_TEST_WORKERS: 50
        run: |
          python build.py
          PREVIOUS_SUBSCRIPTION="$RUNNER_TEMP/previous-subscription.yaml" python prepare_candidates.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
