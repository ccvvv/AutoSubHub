name: Auto build subscription

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: domestic-probe-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Mihomo core
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz | gunzip -c > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Build, proxy-test and validate subscription
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
          CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT }}
          HANDSHAKE_WORKERS: ${{ vars.HANDSHAKE_WORKERS }}
          HTTP_WORKERS: ${{ vars.HTTP_WORKERS }}
          HTTP_TEST_TIMEOUT: ${{ vars.HTTP_TEST_TIMEOUT }}
          DOWNLOAD_BYTES: ${{ vars.DOWNLOAD_BYTES }}
          DOWNLOAD_MIN_KBPS: 500
          SPEED_TEST_WORKERS: 50
        run: python build.py

      - name: Commit candidate subscription and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/domestic-probe/candidates.yaml data/domestic-probe/candidate-manifest.json
          git diff --cached --quiet || {
            git commit -m "chore: publish GitHub-screened probe candidates"
            git push
          }

      - name: Preserve previously published final subscription
        run: |
          mkdir -p site
          if curl -fsSL "https://ccvvv.github.io/AutoSubHub/subscription.yaml" -o site/subscription.yaml; then
            echo "Preserved the last Mi 6-verified subscription."
          else
            echo "No previous final subscription exists yet; candidate feed will be published first."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload candidate feed and preserved final subscription
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy candidate feed
        id: deployment
        uses: actions/deploy-pages@v4
