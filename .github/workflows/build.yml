name: Auto build subscription

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Mihomo core
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz | gunzip -c > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Build, proxy-test and validate subscription
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
          CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT }}
          HANDSHAKE_WORKERS: ${{ vars.HANDSHAKE_WORKERS }}
          MAX_NODES: ${{ vars.MAX_NODES }}
          HTTP_WORKERS: ${{ vars.HTTP_WORKERS }}
          HTTP_TEST_TIMEOUT: ${{ vars.HTTP_TEST_TIMEOUT }}
          DOWNLOAD_TEST_NODES: ${{ vars.DOWNLOAD_TEST_NODES }}
          DOWNLOAD_BYTES: ${{ vars.DOWNLOAD_BYTES }}
        run: python build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
