name: Build cloud pending probe queue

on:
  push:
    branches: [published-subscriptions]
    paths:
      - "candidate/subscription.yaml"
      - "receipts/latest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-pending-queue
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build cumulative deduplicated queue in cloud
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m py_compile scripts/build_pending_queue.py scripts/candidate_queue.py
          python scripts/build_pending_queue.py --output-dir /tmp/pending-output

      - name: Publish pending queue to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch published-subscriptions "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/published
          mkdir -p /tmp/published/candidate
          for name in pending.yaml pending-manifest.json pending-meta.json; do
            if [ -f "/tmp/pending-output/$name" ]; then
              cp "/tmp/pending-output/$name" "/tmp/published/candidate/$name"
            else
              rm -f "/tmp/published/candidate/$name"
            fi
          done
          cd /tmp/published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A candidate
          if git diff --cached --quiet; then
            echo "Cloud pending queue is already current."
            exit 0
          fi
          git commit -m "Refresh cloud-prepared pending probe queue"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:published-subscriptions; then
              pushed=true
              break
            fi
            git fetch origin published-subscriptions
            git rebase origin/published-subscriptions
          done
          if [ "$pushed" != true ]; then
            echo "Could not publish cloud pending queue after three attempts."
            exit 1
          fi
