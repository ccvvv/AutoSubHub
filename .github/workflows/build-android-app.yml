name: Build AutoSubHub Android app

on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-dashboard, feature/embedded-terminal-preview]
    paths:
      - "android-app/**"
      - "app_control.sh"
      - "termux_probe.py"
      - "upload_receipt.py"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Termux dispatcher shell syntax
        run: bash -n app_control.sh
      - name: Check Python syntax
        run: python3 -m py_compile termux_probe.py upload_receipt.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubHub-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
