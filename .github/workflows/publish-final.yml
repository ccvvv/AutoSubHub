name: Publish phone-verified final subscription

on:
  push:
    branches: [probe-results]
    paths:
      - "receipts/latest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-verified-final-publisher
  cancel-in-progress: false

jobs:
  publish-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest phone receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin probe-results
          git show FETCH_HEAD:receipts/latest.json > /tmp/receipt.json

      - name: Fetch public candidate snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch published-subscriptions \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/published
          test -s /tmp/published/candidate/subscription.yaml
          test -s /tmp/published/candidate/manifest.json

      - name: Build and validate final subscription from phone receipt
        env:
          CANDIDATE_FILE: /tmp/published/candidate/subscription.yaml
          MANIFEST_FILE: /tmp/published/candidate/manifest.json
          RECEIPT_FILE: /tmp/receipt.json
          OUTPUT_FILE: /tmp/final.yaml
          OUTPUT_MANIFEST_FILE: /tmp/final-manifest.json
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML>=6,<7'
          python finalize.py

      - name: Rotate final versions and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/published
          mkdir -p final
          if [ -s final/latest.yaml ]; then
            cp final/latest.yaml final/previous.yaml
          fi
          if [ -s final/previous.yaml ]; then
            cp final/previous.yaml final/older.yaml.tmp
          fi
          if [ -s final/older.yaml.tmp ]; then
            mv final/older.yaml.tmp final/older.yaml
          fi
          cp /tmp/final.yaml final/latest.yaml
          cp /tmp/final-manifest.json final/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/latest.yaml final/latest.json final/previous.yaml final/older.yaml 2>/dev/null || true
          git add -u final
          if git diff --cached --quiet; then
            echo "Final subscription unchanged; no rotation needed."
            exit 0
          fi
          git commit -m "Publish phone-verified final subscription"
          git push origin HEAD:published-subscriptions
