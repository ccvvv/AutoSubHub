name: Finalize phone-tested subscription

on:
  push:
    branches: [published-subscriptions]
    paths:
      - "receipts/latest.json"
      - "receipts/candidate.yaml"
      - "receipts/manifest.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-phone-receipt.yml"
      - "scripts/finalize_phone_receipt.py"
      - "scripts/prune_candidate_pool.py"
      - "scripts/build_incremental_candidates.py"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: published-subscriptions-writer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Fetch the exact receipt snapshot from the data branch
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published
          git -C published fetch --no-tags origin published-subscriptions
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/published-subscriptions" ]; then
            git -C published fetch --no-tags origin "${GITHUB_SHA}"
            RECEIPT_REF="${GITHUB_SHA}"
          else
            RECEIPT_REF="origin/published-subscriptions"
          fi
          if ! git -C published cat-file -e "${RECEIPT_REF}:receipts/latest.json" 2>/dev/null; then
            echo "No pending phone receipt on published-subscriptions."
            echo "has_receipt=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p incoming
          git -C published show "${RECEIPT_REF}:receipts/latest.json" > incoming/receipt.json
          git -C published show "${RECEIPT_REF}:receipts/candidate.yaml" > incoming/subscription.yaml
          git -C published show "${RECEIPT_REF}:receipts/manifest.json" > incoming/manifest.json
          sha256sum incoming/receipt.json | cut -d' ' -f1 > incoming/receipt.sha256
          echo "has_receipt=true" >> "${GITHUB_OUTPUT}"

      - name: Validate receipt and build final
        id: finalize
        if: steps.receipt.outputs.has_receipt == 'true'
        env:
          MIN_SPEED_BPS: "200000"
          HIGH_SPEED_BPS: "500000"
        run: |
          set -euo pipefail
          python scripts/finalize_phone_receipt.py incoming/subscription.yaml incoming/manifest.json incoming/receipt.json incoming/final.yaml incoming/final-v2raytun.txt

      - name: Publish final versions without overwriting concurrent data
        if: steps.receipt.outputs.has_receipt == 'true' && steps.finalize.outputs.has_final_nodes == 'true'
        run: |
          set -euo pipefail
          cd published
          git checkout -B publish-work origin/published-subscriptions
          mkdir -p final
          if [ -f final/previous.yaml ]; then cp final/previous.yaml final/older.yaml; fi
          if [ -f final/latest.yaml ]; then cp final/latest.yaml final/previous.yaml; fi
          cp ../incoming/final.yaml final/latest.yaml
          cp ../incoming/final-v2raytun.txt final/latest-v2raytun.txt
          python ../scripts/update_lifecycle.py final/latest.yaml lifecycle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/ lifecycle.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish phone-tested final subscription"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:published-subscriptions; then
                pushed=true
                break
              fi
              git fetch origin published-subscriptions
              if ! git rebase origin/published-subscriptions; then
                git rebase --abort || true
                echo "Concurrent data-branch conflict; receipt remains available for retry."
                exit 1
              fi
            done
            if [ "$pushed" != true ]; then
              echo "Could not publish after three fast-forward retries."
              exit 1
            fi
          else
            echo "Final subscription is unchanged."
          fi

      - name: Consume only the receipt that was actually processed
        if: steps.receipt.outputs.has_receipt == 'true'
        run: |
          set -euo pipefail
          cd published
          git fetch origin published-subscriptions
          git checkout -B consume-work origin/published-subscriptions
          expected="$(cat ../incoming/receipt.sha256)"
          if [ ! -f receipts/latest.json ]; then
            echo "Receipt was already consumed."
            exit 0
          fi
          actual="$(sha256sum receipts/latest.json | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "A newer phone receipt is present; leaving it untouched."
            exit 0
          fi
          # The receipt was fully validated in the earlier step. Remove exactly
          # those tested IDs from the latest pool, preserving nodes added meanwhile.
          if [ ! -f candidate/pool.yaml ]; then
            echo "Persistent candidate pool missing; refusing receipt consumption."
            exit 1
          fi
          python ../scripts/prune_candidate_pool.py candidate/pool.yaml ../incoming/manifest.json ../incoming/receipt.json
          files=()
          for file in receipts/latest.json receipts/candidate.yaml receipts/manifest.json; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No receipt bundle to consume."
            exit 0
          fi
          git rm -- "${files[@]}"
          git add candidate/pool.yaml candidate/pool-manifest.json candidate/probe-state.json candidate/subscription.yaml candidate/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Consume successfully processed phone receipt"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:published-subscriptions; then
              pushed=true
              break
            fi
            git fetch origin published-subscriptions
            if ! git rebase origin/published-subscriptions; then
              git rebase --abort || true
              echo "Receipt cleanup conflicted with a concurrent update; receipt remains for safe retry."
              exit 1
            fi
            if [ -f receipts/latest.json ]; then
              actual="$(sha256sum receipts/latest.json | cut -d' ' -f1)"
              if [ "$actual" != "$expected" ]; then
                echo "A newer receipt arrived during cleanup; preserving it."
                exit 0
              fi
            fi
          done
          if [ "$pushed" != true ]; then
            echo "Could not consume receipt after three fast-forward retries."
            exit 1
          fi
      - name: Notify NodeLife after successful finalization
        if: steps.receipt.outputs.has_receipt == 'true' && steps.finalize.outputs.has_final_nodes == 'true'
        uses: actions/github-script@v7
        env:
          LIFEDISPATCH_TOKEN: ${{ secrets.LIFEDISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.LIFEDISPATCH_TOKEN;
            if (!token) {
              core.warning("LIFEDISPATCH_TOKEN is not configured; NodeLife will catch up on its scheduled run.");
              return;
            }

            const payload = {
              event_type: "auto-subhub-final-published",
              client_payload: {
                source_repository: context.repo.owner + "/" + context.repo.repo,
                source_branch: "published-subscriptions",
                final_subscription: "final/latest.yaml"
              }
            };

            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch("https://api.github.com/repos/ccvvv/NodeLife/dispatches", {
                  method: "POST",
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization": `Bearer ${token}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(payload)
                });
                if (!response.ok) {
                  const detail = await response.text();
                  throw new Error(`GitHub API HTTP ${response.status}: ${detail}`);
                }
                core.info("NodeLife dispatch accepted by GitHub.");
                lastError = undefined;
                break;
              } catch (error) {
                lastError = error;
                core.warning(`NodeLife dispatch attempt ${attempt}/3 failed: ${error.message}`);
                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, 2000));
                }
              }
            }

            if (lastError) {
              core.warning("Immediate NodeLife dispatch failed after three attempts; the six-hour scheduled catch-up remains enabled.");
            }
