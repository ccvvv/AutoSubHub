name: Finalize phone-tested subscription

on:
  push:
    branches: [probe-receipts, main]
    paths: ["receipts/*.json", ".github/workflows/finalize-phone-receipt.yml", "scripts/finalize_phone_receipt.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-final-publish
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Fetch receipt and its exact merged candidate snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          git clone --depth 1 --branch probe-receipts "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" receipts
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git -C receipts fetch --no-tags origin "${GITHUB_SHA}"
            RECEIPT_REF="${GITHUB_SHA}"
          else
            RECEIPT_REF="origin/probe-receipts"
          fi
          git -C receipts show "${RECEIPT_REF}:receipts/latest.json" > incoming/receipt.json
          if git -C receipts cat-file -e "${RECEIPT_REF}:receipts/candidate.yaml" 2>/dev/null; then
            git -C receipts show "${RECEIPT_REF}:receipts/candidate.yaml" > incoming/subscription.yaml
            git -C receipts show "${RECEIPT_REF}:receipts/manifest.json" > incoming/manifest.json
          else
            # Backward compatibility for receipts uploaded by the earlier single-batch client.
            CANDIDATE_COMMIT="$(python -c 'import json; print(json.load(open("incoming/receipt.json"))["candidate_commit"])')"
            if ! [[ "${CANDIDATE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Receipt candidate_commit is missing or invalid."
              exit 1
            fi
            git clone --no-checkout --filter=blob:none --branch published-subscriptions "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published
            git -C published fetch --no-tags origin "${CANDIDATE_COMMIT}"
            git -C published show "${CANDIDATE_COMMIT}:candidate/subscription.yaml" > incoming/subscription.yaml
            git -C published show "${CANDIDATE_COMMIT}:candidate/manifest.json" > incoming/manifest.json
          fi
          if [ ! -d published ]; then
            git clone --no-checkout --filter=blob:none --branch published-subscriptions "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published
          fi
      - name: Validate receipt and build final
        env:
          MIN_SPEED_BPS: "200000"
          HIGH_SPEED_BPS: "500000"
        run: |
          set -euo pipefail
          python scripts/finalize_phone_receipt.py incoming/subscription.yaml incoming/manifest.json incoming/receipt.json incoming/final.yaml incoming/final-v2raytun.txt
      - name: Rotate and publish three final versions
        run: |
          set -euo pipefail
          cd published
          mkdir -p final
          if [ -f final/previous.yaml ]; then cp final/previous.yaml final/older.yaml; fi
          if [ -f final/latest.yaml ]; then cp final/latest.yaml final/previous.yaml; fi
          cp ../incoming/final.yaml final/latest.yaml
          cp ../incoming/final-v2raytun.txt final/latest-v2raytun.txt
          python ../scripts/update_lifecycle.py final/latest.yaml lifecycle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final/ lifecycle.json
          if git diff --cached --quiet; then
            echo "Final subscription is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish phone-tested final subscription"
          git push origin HEAD:published-subscriptions
