name: Validate domestic probe

on:
  pull_request:
    paths:
      - "ingest_domestic_probe.py"
      - "prepare_candidates.py"
      - "tests/**"
      - ".github/workflows/ingest-domestic-probe.yml"
      - ".github/workflows/validate-domestic-probe.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile ingest_domestic_probe.py prepare_candidates.py

      - name: Run receipt validation tests
        run: python -m unittest discover -s tests -v
